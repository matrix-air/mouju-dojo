<style>
:root{
  --paper:#f6f1e6; --card:#fffdf6; --ink:#26221a; --sub:#6f6653; --line:#e4dbc6;
  --zhu:#b5402e; --qing:#2b3a55; --jin:#a8842c; --green:#3e6b4f;
  --radius:12px; --shadow:0 1px 3px rgba(60,50,20,.08);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);
  font:16px/1.75 -apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;}
h1,h2,h3,.serif{font-family:"Songti SC","Noto Serif SC","STSong",serif;}
header{position:sticky;top:0;z-index:50;background:rgba(246,241,230,.96);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);}
.hbar{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 16px;}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);}
.seal{width:34px;height:34px;background:var(--zhu);color:#fff;border-radius:6px;display:flex;
  align-items:center;justify-content:center;font-family:"Songti SC",serif;font-size:20px;font-weight:700;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);}
.brand b{font-size:19px;letter-spacing:2px;}
.brand small{color:var(--sub);font-size:11px;display:block;letter-spacing:1px;}
nav{display:flex;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch;flex:1;}
nav a{padding:7px 12px;border-radius:8px;text-decoration:none;color:var(--sub);white-space:nowrap;font-size:14.5px;}
nav a.on{background:var(--qing);color:#fff;}
nav a:hover{background:#ece5d3;color:var(--ink);}
main{max-width:1080px;margin:0 auto;padding:22px 16px 80px;}
footer{border-top:1px solid var(--line);color:var(--sub);font-size:12.5px;text-align:center;padding:18px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:18px 20px;margin-bottom:14px;}
.grid{display:grid;gap:14px;}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));}
.kicker{font-size:12px;letter-spacing:3px;color:var(--zhu);text-transform:uppercase;}
.big{font-size:46px;font-weight:700;line-height:1.1;font-family:"Songti SC",serif;}
.sub{color:var(--sub);}
.tag{display:inline-block;font-size:12px;padding:1px 9px;border-radius:99px;border:1px solid var(--line);
  color:var(--sub);margin-right:6px;vertical-align:middle;}
.tag.z{background:#f7e6e1;border-color:#e8c4ba;color:var(--zhu);}
.tag.q{background:#e7ecf3;border-color:#c7d2df;color:var(--qing);}
.tag.j{background:#f4ecd9;border-color:#e0d0a8;color:var(--jin);}
.btn{display:inline-block;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 16px;
  border-radius:9px;cursor:pointer;font-size:14.5px;text-decoration:none;}
.btn:hover{border-color:var(--qing);}
.btn.p{background:var(--zhu);border-color:var(--zhu);color:#fff;}
.btn.p:hover{opacity:.92;}
.btn.ghost{background:transparent;}
.btn:disabled{opacity:.4;cursor:default;}
input[type=text],textarea,select{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;
  padding:9px 11px;font:inherit;color:var(--ink);}
textarea{min-height:64px;resize:vertical;}
label{display:block;font-size:13px;color:var(--sub);margin:12px 0 4px;letter-spacing:.5px;}
label b{color:var(--ink);}
.chk{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--line);
  border-radius:9px;margin-bottom:8px;background:#fff;cursor:pointer;}
.chk input{margin-top:5px;}
.chk.done{background:#eef3ea;border-color:#ccd9c4;text-decoration:line-through;color:var(--sub);}
hr{border:none;border-top:1px dashed var(--line);margin:16px 0;}
.muted{color:var(--sub);font-size:13.5px;}
.models .m{border-top:1px dashed var(--line);padding:14px 0;}
.models .m:first-child{border-top:none;padding-top:4px;}
.models h4{margin:0 0 6px;font-size:16.5px;}
.models ul{margin:6px 0 4px;padding-left:20px;}
.models li{margin:3px 0;}
.src{font-size:12px;color:var(--sub);margin-top:6px;}
.layerhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
.lbadge{font-family:"Songti SC",serif;font-weight:700;color:#fff;border-radius:8px;padding:3px 12px;font-size:15px;}
.openq{background:#f4efe2;border-left:3px solid var(--jin);padding:10px 14px;border-radius:0 8px 8px 0;font-size:14px;}
.flash{min-height:180px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;}
.flash .q{font-size:22px;font-family:"Songti SC",serif;}
.flash .a{font-size:16px;color:var(--qing);margin-top:14px;}
.pivot{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;}
.pivot button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 13px;cursor:pointer;font-size:13.5px;color:var(--sub);}
.pivot button.on{background:var(--zhu);border-color:var(--zhu);color:#fff;}
table{width:100%;border-collapse:collapse;font-size:14px;background:#fff;border-radius:10px;overflow:hidden;}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;}
th{background:#f0e9d8;font-weight:600;}
.treeq{font-size:19px;font-family:"Songti SC",serif;margin:6px 0 14px;}
.jitem{border-top:1px dashed var(--line);padding:10px 2px;font-size:14.5px;}
.jitem:first-of-type{border-top:none;}
.jmeta{font-size:12px;color:var(--sub);}
.casehead{cursor:pointer;}
.casehead h3{margin:0;display:inline;}
.newpill{background:var(--zhu);color:#fff;font-size:11px;border-radius:99px;padding:2px 9px;margin-left:8px;vertical-align:middle;}
.stat{display:flex;gap:26px;flex-wrap:wrap;}
.stat div b{display:block;font-size:26px;font-family:"Songti SC",serif;color:var(--qing);}
a{color:var(--qing);}
.bar{height:8px;background:#ece5d3;border-radius:99px;overflow:hidden;margin-top:6px;}
.bar i{display:block;height:100%;background:var(--zhu);}
@media(max-width:640px){ .big{font-size:36px;} main{padding:16px 12px 60px;} .card{padding:14px;} }
</style>
</head>

<script>
'use strict';
/* ================= 数据层 ================= */
const BUILD='2026-09-16';
const LAYERS=[
{id:'L0',n:'本心罗盘',slogan:'坚守本心',color:'#b5402e',one:'本心是开局前唯一必须锁定的参数：谋略的一切手段都消耗「你是谁」这个资产，先记账才有资格谈消耗。',
 models:[
  {n:'三张表锁定目标',d:'动手之前填满，填不满就不许开局。',pts:['终局表：要的最终状态写成可判定的画面，不是「成功/幸福」','手段表：愿意用哪些、明确不用哪些——不用清单=红线，越早写越便宜','代价表：时间/金钱/关系/声誉/心力各付到什么刻度就停，提前写止损线'],src:'讲义 L0.1'},
  {n:'阳谋经济学（Axelrod 四性质）',d:'短局靠算计，长局靠信用——这是数学结论不是劝善。',pts:['善良：永远不先背叛','可激怒：被占便宜当轮回应，不做老好人','宽容：对方回头立刻翻篇，不记仇过夜','清晰：策略简单到一眼看懂——可预测的善良比深不可测的聪明更可怕，一次被识破的算计摧毁所有未来局的定价'],src:'Axelrod《The Evolution of Cooperation》1984'},
  {n:'阳明心学的工程化',d:'把「坚守本心」从抒情变成可操作功夫。',pts:['本心/良知＝未经污染的判断系统（知是知非的直觉探测器）','致良知＝每天在具体事务上校准它（事上磨练，不是打坐）','知行合一：「知道但做不到」＝其实不信，回炉重修','自测句：这事敢不敢写进给所有人的公开备忘录？敢=阳谋'],src:'《传习录》；知行合一/致良知'},
  {n:'目标刻度：单局 vs 长局',d:'多数悲剧来自用单局思维玩长局（或反之）。',pts:['先问这局嵌在哪个更大的局里','最大的那个局叫「你这个人」','换的是手段和路径，锚定的是身份和红线'],src:'讲义 总纲'}],
 tool:'#canvas',open:['目标会变，本心稳定与目标迭代怎么兼容？（假设：变的是手段，锚定的是身份红线）','红线清单第一次怎么列？','「可激怒」的现代温和版刻度怎么定？'],read:'../谋局能力讲义.md'},

{id:'L1',n:'识局',slogan:'谋局 · 读盘',color:'#8a4a2e',one:'知己知彼是作业流程：拿到任何局面先填五要素画布，填不满的地方就是情报缺口；诊断一句话写不出，禁止进入谋局。',
 models:[
  {n:'五要素画布',d:'玩家 / 利益 / 规则 / 信息 / 时间窗，五格强制填写。',pts:['玩家：谁能影响结果？含不在场但能掀桌的人','利益：真正要什么（不是他说他要什么）——把立场当利益是头号盲区','规则：显规则（制度）+潜规则（惯例/面子），潜规则才是执行层','信息：谁知道什么；高估自己信息质量是通病','时间窗：局的有效期；默认局是静态的是错觉，多数局拖久必变盘'],src:'讲义 L1.1'},
  {n:'Rumelt 战略核（验收标准）',d:'识局的标准输出=三件套；反面是坏战略四征兆。',pts:['诊断：把纷繁现实压缩成一个关键挑战——不尖锐后面全空转','指导方针：应对挑战的总路线，只指方向不给清单','连贯行动：资源与动作互相咬合','坏战略征兆：空话堆砌 / 回避真挑战 / 把目标当战略 / 烂目标'],src:'Rumelt《Good Strategy / Bad Strategy》'},
  {n:'孙子五事七计',d:'两千年前版本的尽职调查清单。',pts:['道=民意/合法性；天=宏观时机；地=赛道位置；将=人才；法=内部效率','七计＝拿五维跟对手逐项对比打分'],src:'《孙子兵法·始计》'},
  {n:'最容易丢的三个人',d:'识局漏了他们，赢了执行输了体系。',pts:['裁判：能改规则的人（上级/监管/平台）','观众：影响声誉定价的旁观者——很多局输在观众席','未来的自己：三年后接残局的人，问他愿不愿意接'],src:'讲义 L1.4'}],
 tool:'#canvas',open:['情报有限时最低要填哪几格才许动手？（候选：玩家+利益+时间窗三缺一不动）','潜规则怎么系统侦察？'],read:'../谋局能力讲义.md'},

{id:'L2',n:'谋局',slogan:'谋局 · 布盘',color:'#2b3a55',one:'先胜而后战：先保证自己没有致命暴露，再等对手出错。高手不是算无遗策，是把自己放在输不了的位置上等。',
 models:[
  {n:'选场：会打的先挑地方',d:'不在对手选的战场、用对手选的规则、按对手选的时间打。',pts:['打得赢就打，打不赢就走——换场不丢人，硬打才丢人','曾国藩版：结硬寨打呆仗，每进一步都不可逆，适合输不起的一方'],src:'讲义 L2.1'},
  {n:'造势：围棋三件工具',d:'位置优势的极致研究可以直接搬。',pts:['势 vs 地：早期多取势（能力/关系/品牌），后期多收地（现金流/份额）','厚势：没有断点的结构——财务冗余、多元技能、可验证信誉，让你「不可被攻击」','余味（aji）：故意不开完的条件、协议里留的复选项——现在不用，未来可选'],src:'围棋理论现代转译（书目级）'},
  {n:'留余地：期权思维',d:'每一手都买「继续的权利」而不是「全部的承诺」。',pts:['BATNA：真实筹码不是诉求而是替代选项；没有 BATNA 的人是猎物','小赌注探针：可承受的小动作测反应，再加注','冗余：关键路径永远有 plan B；单点依赖=把命门放别人手里'],src:'讲义 L2.3'},
  {n:'卡时间窗：局的半衰期',d:'所有局都有有效期。',pts:['抢窗：窗口开启时集中投入（先发期/对手换届期/恐慌期）','熬缩：窗口不利时用冗余拖到变盘','论持久战骨架：防御→相持→反攻，每阶段换打法——跟时间做朋友'],src:'讲义 L2.4'}],
 tool:'#canvas',open:['「势」怎么量化追踪？（候选：可调用资源清单+他人主动来找你的频次）','换场成本怎么事前估算？'],read:'../谋局能力讲义.md'},

{id:'L3',n:'落子',slogan:'步棋',color:'#3e6b4f',one:'谋局定了在哪打，落子解决每一步怎么走：要么积累位置，要么逼对手犯错。',
 models:[
  {n:'主动权（tempo / OODA）',d:'胜负常取决于谁先完成自己的决策循环。',pts:['Boyd OODA：观察→调整→决策→行动，运转在对手内环里','每手问：这步是逼对手回应（我掌握 tempo），还是回应对手（在他的 tempo 里）？',' tempo 里的应手要想怎么转化为反先手'],src:'Boyd《Patterns of Conflict》'},
  {n:'正合奇胜',d:'正=预期内的正面力量（不下牌桌），奇=预期外的角度（赢下牌桌）。',pts:['只用正→消耗战；只用奇→赌徒','健康比例：正面稳住+小成本持续试奇，试出胜率就切主力','奇手产生机制（土办法）：每周强制列 3 个「对手绝对想不到」的选项'],src:'《孙子兵法·势篇》'},
  {n:'弃取：会输子的人才会赢棋',d:'局部损失换全局先手；沉没成本不参与决策。',pts:['弃子争先：让出无关紧要的功劳/条款/面子，换关键节奏或立场','每步只算「从此刻起最优」','kill criteria：事前写触发信号，触发就撤——写的时候是 CEO，局中的你是赌徒'],src:'讲义 L3.3'},
  {n:'收官：赢在最后十步',d:'优势不会自动变成胜利。',pts:['领先后的正确动作是收缩和锁定','把流动的优势固化成结构：合同/制度/习惯/关系/复购','多数局赢在中盘输在官子——赢家在优势期又开始浪'],src:'讲义 L3.4'}],
 tool:'#move',open:['奇手除了穷举还有没有更可靠的产生机制？','怎么给自己装「强制 Orient」的铃（OODA 第二步最常被跳过）？'],read:'../谋局能力讲义.md'},

{id:'L4',n:'谋人局',slogan:'谋人局',color:'#a8842c',one:'不要说服人，要设计处境：让别人的利益自动推动你的目标（阳谋）。人性不想被说服，人性想被理解。',
 models:[
  {n:'激励相容 / 利益翻译',d:'最优解不是打动他，是让「帮你」落在他自己利益的路径上。',pts:['阳谋定义：把牌摊开，对手按自己的利益走，结果恰好成全我——不依赖信息优势，不怕被看穿','利益翻译三问：他的 KPI 是什么？他怕什么？他向谁交差？','然后把你的诉求改写成帮他交差/避雷的形状'],src:'讲义 L4.1'},
  {n:'结盟：利益图谱先于感情',d:'找天然盟友，不找酒肉投缘。',pts:['天然盟友=利益同向且互补的人','联盟寿命=利益重叠期；开局就想好分岔时的体面退出','给功劳是建联盟最便宜的手段——功劳是流水，盟友是资产'],src:'讲义 L4.2'},
  {n:'谈判工具箱（原则派+共情派）',d:'两手都要硬。',pts:['原则派：对事不对人；谈利益不谈立场；发明双赢选项；客观标准；BATNA 定底线','标注：「你们担心的是工期对吧？」——说中的情绪自动降温，用「看起来/听起来」留否定空间','镜像+沉默≥4 秒；「你说得对」=对方感到被完整理解','校准问题只用「什么/如何」，禁「为什么」；设计让对方安全地说「不」','指控审查先拔刺：「我知道您会想：又是来要人的」','Ackerman 砍价：让步 65→85→95→100 递减+非整数终价（学术验证较弱，降级使用）'],src:'Fisher&Ury《Getting to Yes》；Voss《Never Split the Difference》；05 章'},
  {n:'沟通实战速查（NVC/关键对话/SBI）',d:'冲突争的不是谁有理，是谁感到安全、被看见。',pts:['NVC 四步：观察→感受→需要→请求；请求与命令的分界=对方拒绝后你是否惩罚','关键对话：崩坏=安全感缺失；对比说明「我不是…我是…」；用「同时」替换「但是」','SBI 反馈：情境-行为-影响(+意图)；三明治反馈约 31% 效应为负，弃用','道歉六要素权重最高：承认责任+提出修复；禁「但是」禁「如果」禁只道歉不修复','被指责四步：标注→复述求确认→对比说明→校准问题「我现在怎么做最合适？」'],src:'Rosenberg；Patterson；CCL；Lewicki 2016；05 章'},

function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dayOfYear(){const d=new Date();return Math.floor((d-new Date(d.getFullYear(),0,0))/864e5);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function streak(){
  const days=new Set(Object.keys(S.checks));
  S.journal.forEach(j=>days.add(j.ts.slice(0,10)));
  S.canvases.forEach(c=>days.add(c.ts.slice(0,10)));
  Object.values(S.mine).forEach(v=>{if(v)days.add(v);});
  let n=0,d=new Date();
  for(;;){const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(days.has(k)){n++;d.setDate(d.getDate()-1);}else break;}
  return n;
}

function buildDeck(){

  (S.journal||[]).filter(j=>j.type==='review').slice(-10).forEach(j=>{
    const fix=(j.text.split('｜改：')[1]||'').trim();
    if(fix)cards.push({k:'rev:'+j.ts,q:'你自己的复盘：「'+esc(j.text.split('｜')[0].replace('赌注：',''))+'」——当时的改法是什么？',a:esc(fix)+'<br><span class="jmeta">来自你自己的复盘</span>',tag:'教训'});
  });
  return cards;
}
function srsReview(k,good){
  S.srs=S.srs||{};const r=S.srs[k]||{interval:1,wrong:0};
  const d=new Date();
  if(good){r.interval=Math.min(60,(r.interval||1)*2);d.setDate(d.getDate()+r.interval);}
  else{r.wrong=(r.wrong||0)+1;r.interval=0;}/* due=今天：没记住的卡留在今日队列里循环出现 */
  r.due=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  S.srs[k]=r;save();
}
